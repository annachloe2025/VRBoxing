{% extends "base.html" %}

{# iPhone のホーム画面追加用アイコン、PWA 用アイコンを <head> に追加 #}
{% block extrahead %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ 'assets/icons/apple-touch-icon-180.png' | url }}">
  <link rel="icon" type="image/svg+xml" href="{{ 'assets/icons/boxing-glove.svg' | url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ 'assets/icons/favicon-192.png' | url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ 'assets/icons/favicon-512.png' | url }}">
{% endblock %}
